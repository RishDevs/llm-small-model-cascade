[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-small-model-cascade"
version = "0.1.0"
description = "Distill a 27.8B Qwen LLM into an INT8 DistilBERT student and route low-confidence requests back to the LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "datasets>=2.19",
    "torch>=2.3",
    "transformers>=4.44",
    "onnx>=1.16",
    "onnxscript>=0.2",
    "onnxruntime>=1.18",
    "matplotlib>=3.8",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
teacher = ["vllm"]

[tool.setuptools.packages.find]
include = ["cascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
